apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabdocs-ws
  labels:
    {{- include "collabdocs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.websocket.replicas }}
  selector:
    matchLabels:
      app: collabdocs-ws
  template:
    metadata:
      labels:
        app: collabdocs-ws
    spec:
      containers:
      - name: collabdocs-ws
        image: "{{ .Values.images.websocket.repository }}:{{ .Values.images.websocket.tag }}"
        imagePullPolicy: {{ .Values.images.websocket.pullPolicy }}
        ports:
        - containerPort: {{ .Values.websocket.port }}
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: collabdocs-secrets
              key: db_url
        - name: PORT
          value: {{ .Values.websocket.port | quote }}
        - name: BACKEND_URL
          value: "http://collabdocs-be:{{ .Values.backend.port }}"
        resources:
          limits:
            cpu: {{ .Values.websocket.resources.limits.cpu | quote }}
          requests:
            cpu: {{ .Values.websocket.resources.requests.cpu | quote }}
